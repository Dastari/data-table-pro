name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Demo typecheck
        run: pnpm demo:typecheck

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Verify generated distribution
        run: git diff --exit-code -- dist

      - name: Verify public API snapshot
        run: pnpm api:check

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Verify packed consumer
        run: pnpm test:consumer

      - name: Demo build
        run: pnpm demo:build

      - name: Browser accessibility and layout tests
        run: pnpm test:browser
